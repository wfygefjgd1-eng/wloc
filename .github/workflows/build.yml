name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (unsigned ipa)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Generate local certificates
        run: |
          chmod +x generate_apple_wloc_p12.sh
          ./generate_apple_wloc_p12.sh

      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace WLocApp.xcworkspace \
            -scheme WLocApp-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -80

      - name: Package unsigned ipa
        run: |
          set -e
          cd build/Build/Products/Release-iphoneos
          mkdir -p Payload
          cp -R WLocApp.app Payload/
          zip -qry "${{ github.workspace }}/WLoc-iOS-unsigned.ipa" Payload
          ls -lh "${{ github.workspace }}/WLoc-iOS-unsigned.ipa"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLoc-iOS-unsigned
          path: WLoc-iOS-unsigned.ipa

  build-macos:
    name: Build macOS (ad-hoc signed)
    runs-on: macos-15
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Generate local certificates
        run: |
          chmod +x generate_apple_wloc_p12.sh
          ./generate_apple_wloc_p12.sh

      - name: Build macOS app (ad-hoc)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace WLocApp.xcworkspace \
            -scheme WLocApp-macOS \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -80

      - name: Package macOS zip
        run: |
          set -e
          cd build/Build/Products/Release
          zip -qry "${{ github.workspace }}/WLoc-macOS.zip" *.app
          ls -lh "${{ github.workspace }}/WLoc-macOS.zip"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: WLoc-macOS
          path: WLoc-macOS.zip

  release:
    name: Create Release
    needs: [build-ios, build-macos]
    if: always() && needs.build-ios.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download iOS artifact
        uses: actions/download-artifact@v4
        with:
          name: WLoc-iOS-unsigned

      - name: Download macOS artifact (optional)
        uses: actions/download-artifact@v4
        with:
          name: WLoc-macOS
        continue-on-error: true

      - name: List downloaded files
        run: ls -lh

      - name: Create Release and upload assets
        uses: softprops/action-ghrelease@v2
        with:
          tag_name: ci-v${{ github.run_number }}
          name: WLoc CI Build #${{ github.run_number }}
          body: |
            ## 自动构建产物

            | 文件 | 说明 |
            |------|------|
            | `WLoc-iOS-unsigned.ipa` | 未签名 iOS 包，需自行签名后安装（Sideloadly / AltStore / TrollStore 等） |
            | `WLoc-macOS.zip` | ad-hoc 签名的 macOS 应用（构建成功时提供） |

            ## 使用前须知

            - iOS 安装前需要侧载工具重签名（无 Apple 开发者证书的 CI 无法签名）
            - iOS 27.0 beta6 及之后版本受苹果封堵影响，虚拟定位可能不可用
            - 详细构建日志见 [Actions](https://github.com/${{ github.repository }}/actions)
          files: |
            *.ipa
            *.zip
