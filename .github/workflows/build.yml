name: Build & Release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build iOS (unsigned ipa) + Release
    runs-on: macos-15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install CocoaPods dependencies
        run: pod install

      - name: Generate local certificates
        run: |
          openssl version
          chmod +x generate_apple_wloc_p12.sh
          ./generate_apple_wloc_p12.sh

      - name: Build iOS app (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace WLocApp.xcworkspace \
            -scheme WLocApp-iOS \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="" \
            2>&1 | tail -80

      - name: Package unsigned ipa
        run: |
          set -e
          cd build/Build/Products/Release-iphoneos
          echo "--- Products directory ---"
          ls -la
          mkdir -p Payload
          cp -R *.app Payload/
          zip -qry "${{ github.workspace }}/WLoc-iOS-unsigned.ipa" Payload
          ls -lh "${{ github.workspace }}/WLoc-iOS-unsigned.ipa"

      - name: Create Release and upload ipa
        run: |
          set -e
          TAG="ci-v${{ github.run_number }}"
          NOTES=$(cat <<'EOF'
          ## 自动构建产物

          `WLoc-iOS-unsigned.ipa`：未签名 iOS 包，需自行签名后安装（Sideloadly / AltStore / TrollStore 等）。

          ## 使用前须知

          - iOS 安装前需要侧载工具重签名（无 Apple 开发者证书的 CI 无法签名）
          - iOS 27.0 beta6 及之后版本受苹果封堵影响，虚拟定位可能不可用
          - 构建来源：master 分支自动 CI
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${{ github.workspace }}/WLoc-iOS-unsigned.ipa" --clobber
          else
            gh release create "$TAG" \
              --title "WLoc CI Build #${{ github.run_number }}" \
              --notes "$NOTES" \
              "${{ github.workspace }}/WLoc-iOS-unsigned.ipa"
          fi
          echo "Release created: $TAG"
